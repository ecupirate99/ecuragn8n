<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECU Housing AI Chatbot</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ecu-purple: #592A8A;
            --ecu-gold: #FEC923;
            --bg-gray: #F3F4F6;
            --text-dark: #333333;
            --card-border: #E5E7EB;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
        }
        /* Header Styles */
        header {
            background-color: var(--ecu-purple);
            padding: 20px 40px;
            color: white;
            border-bottom: 6px solid var(--ecu-gold);
            display: flex;
            align-items: center;
        }
        .logo-container {
            background: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }
        .logo-container i {
            color: var(--ecu-purple);
            font-size: 28px;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        header p {
            margin: 0;
            font-size: 14px;
            font-weight: 400;
            opacity: 0.9;
        }
        /* Main Layout */
        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--card-border);
        }
        /* Greeting Card */
        .greeting-card h2 {
            color: var(--ecu-purple);
            margin-top: 0;
            font-size: 20px;
        }
        .greeting-card p {
            color: #666;
            line-height: 1.5;
        }
        /* Input Card */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .label {
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1px;
            color: #555;
            text-transform: uppercase;
        }
        .clear-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .clear-btn:hover {
            color: #555;
        }
        .input-wrapper {
            position: relative;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            padding: 15px;
        }
        textarea {
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 16px;
            min-height: 80px;
            color: #444;
        }
        .send-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: #94A3B8;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .send-btn:hover {
            background-color: var(--ecu-purple);
        }
        .send-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        /* Response Card */
        .response-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: var(--ecu-purple);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .robot-icon-small {
            background: var(--ecu-gold);
            color: var(--ecu-purple);
            padding: 6px;
            border-radius: 6px;
            font-size: 14px;
        }
        #response-content {
            line-height: 1.6;
            color: #374151;
            white-space: pre-wrap;
        }
        /* Loading Spinner */
        .dots:after {
            content: ' .';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' ..'; }
            60% { content: ' ...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <i class="fas fa-robot"></i>
        </div>
        <div>
            <h1>ECU Housing</h1>
            <p>Residence Hall AI Chatbot</p>
        </div>
    </header>
    <main>
        <!-- Welcome Section -->
        <div class="card greeting-card">
            <h2>How can we help you today?</h2>
            <p>Ask anything about our neighborhoods, residence halls, amenities, or living on campus at East Carolina University.</p>
        </div>
        <!-- Question Section -->
        <div class="card">
            <div class="card-header">
                <span class="label">Your Question</span>
                <button class="clear-btn" onclick="clearChat()">
                    <i class="far fa-trash-alt"></i> Clear Chat
                </button>
            </div>
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="e.g., Tell me about the West End neighborhood..."></textarea>
                <button id="send-btn" class="send-btn" onclick="askQuestion()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
        <!-- Response Section -->
        <div class="card" id="response-card" style="display: none;">
            <div class="response-label">
                <div class="robot-icon-small">
                    <i class="fas fa-robot"></i>
                </div>
                RESPONSE
            </div>
            <div id="response-content"></div>
        </div>
    </main>

    <script>
        const inputField = document.getElementById('user-input');
        const responseCard = document.getElementById('response-card');
        const responseContent = document.getElementById('response-content');
        const sendBtn = document.getElementById('send-btn');

        async function askQuestion() {
            const question = inputField.value.trim();
            if (!question) return;

            // UI State: Disable input and show loading
            sendBtn.disabled = true;
            responseCard.style.display = 'block';
            responseContent.innerHTML = '<span class="dots">Processing your request</span>';

            try {
                // ============================================================
                // n8n webhook URL — called directly, no proxy.
                // Requires the n8n Webhook node (and/or "Respond to Webhook"
                // node) to send an Access-Control-Allow-Origin header and
                // accept OPTIONS preflight requests. See setup notes below.
                // ============================================================
                const targetUrl = 'https://ecupirate99-n8n-free.hf.space/webhook/23dff5a9-0196-478c-8301-e8efa94089d4';

                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    // 3. Payload key updated to 'chatInput' as requested
                    body: JSON.stringify({ chatInput: question })
                });

                // Read the body as text first so empty/non-JSON responses don't break JS
                const rawText = await response.text();

                if (!response.ok) {
                    throw new Error(`Server error (${response.status}): ${rawText || 'no details returned'}`);
                }

                if (!rawText) {
                    throw new Error('Webhook returned an empty response. Check that your n8n workflow ends in a "Respond to Webhook" node set to return JSON.');
                }

                let data;
                try {
                    data = JSON.parse(rawText);
                } catch (parseErr) {
                    throw new Error('Webhook did not return valid JSON: ' + rawText.slice(0, 200));
                }

                // Render back the response payload keys
                responseContent.innerText = data.output || data.response || JSON.stringify(data);

            } catch (error) {
                console.error('Error:', error);
                responseContent.innerHTML = `<span style="color: red;">Sorry, there was an error processing your request: ${error.message}</span>`;
            } finally {
                sendBtn.disabled = false;
            }
        }

        function clearChat() {
            inputField.value = '';
            responseCard.style.display = 'none';
            responseContent.innerText = '';
        }

        // Allow sending with Enter key (but Shift+Enter for new line)
        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                askQuestion();
            }
        });
    </script>
</body>
</html>
